<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Gym Slots</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>


  <div id="authBox" class="card auth-box-layout">
    <h3 id="authTitle">Login</h3>

    <input id="name" class="hidden" placeholder="Full Name">
    <input id="email" value="rahul@123.com" placeholder="Email">
    <input id="pass" type="password" value="password123" placeholder="Password">

    <button>Submit</button>
    <p class="toggle-text">New user? Register here</p> 
  </div>


  <div id="appBox" class="hidden">
    <div class="header-row">
      <button>Logout</button>
    </div>
    <h3>Available Sessions</h3>
  </div>




  <script src="app.js"></script>
</body>

</html>
